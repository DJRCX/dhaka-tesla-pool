name: CI

on:
  push:
    branches: [master, 'feature/**', pre-release]
  pull_request:
    branches: [master, pre-release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  POSTGRES_IMAGE: postgres:17-alpine
  JWT_SECRET: ci-test-jwt-secret-min-32-characters!!
  DATABASE_URL: postgres://teslapool:change-me-locally@localhost:54330/teslapool_test
  TEST_DATABASE_URL: postgres://teslapool:change-me-locally@localhost:54330/teslapool_test
  WEB_ORIGIN: http://localhost:43123
  API_INTERNAL_URL: http://localhost:48080

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      db-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teslapool
          POSTGRES_PASSWORD: change-me-locally
          POSTGRES_DB: teslapool_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U teslapool -d teslapool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build shared package
        run: npm run build -w @teslapool/shared

      - name: Test
        run: npm test
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          WEB_ORIGIN: ${{ env.WEB_ORIGIN }}

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: dhaka-tesla-pool-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: dhaka-tesla-pool-web:ci
          build-args: |
            API_INTERNAL_URL=http://api:4000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
