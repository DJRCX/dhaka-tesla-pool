services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    ports:
      - '54329:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teslapool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-teslapool}
    volumes:
      - teslapool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-teslapool} -d ${POSTGRES_DB:-teslapool}']
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    ports:
      - '54330:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teslapool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: teslapool_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-teslapool} -d teslapool_test']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: dhaka-tesla-pool-api:local
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-teslapool}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-teslapool}
      JWT_SECRET: ${JWT_SECRET:-replace-with-32+-random-characters-here}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:43123}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'node dist/db/migrate.js && node dist/db/seed.js',
      ]

  api:
    image: dhaka-tesla-pool-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '48080:4000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-teslapool}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-teslapool}
      JWT_SECRET: ${JWT_SECRET:-replace-with-32+-random-characters-here}
      API_PORT: '4000'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:43123}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  teslapool_pgdata:
